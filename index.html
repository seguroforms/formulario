    /* ── Card / recuadro principal ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px 44px;
      box-shadow: 0 32px 80px rgba(,0,0,0.35);
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── Header ── */
    .card-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .card-header .badge {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 14px;
    }

    .card-header h1 {
      color: var(--text);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .card-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 8px;
    }

    /* ── Grid de campos ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Campos que ocupan las 2 columnas */
    .form-group.full { grid-column: 1 / -1; }

    label {
      color: var(--text-muted);
      font-size: 0.80rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(0,0,0,0.30);
    }

    /* Opciones de select con fondo oscuro para legibilidad */
    select option {
      background: #b0e083;
      color: #fff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent2);
      background: rgba(255,255,255,0.24);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.20);
    }

    textarea { resize: vertical; min-height: 80px; }

    /* ── Botón ── */
    .btn-submit {
      margin-top: 28px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      box-shadow: 0 8px 32px rgba(124,58,237,0.40);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(124,58,237,0.55);
    }

    .btn-submit:active { transform: translateY(0); opacity: 0.9; }

    /* ── Footer del card ── */
    .card-footer {
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .card-footer a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 500;
    }

    .card-footer a:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .card { padding: 36px 24px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
    }
  </style>

</head>
